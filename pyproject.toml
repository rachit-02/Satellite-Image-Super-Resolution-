[project]
name = "satellite-image-super-resolution"
version = "0.1.0"
description = "Dashboard for CGA satellite image super-resolution results"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "Flask>=3.0,<4",
    "numpy>=1.26",
    "Pillow>=10.0",
    "gunicorn>=22.0",
]

[tool.vercel]
entrypoint = "dashboard.app:app"
